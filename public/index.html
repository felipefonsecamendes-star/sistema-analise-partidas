<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameMetrics - Login</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="box">
<h2>GameMetrics</h2>
<form id="fl"><h3>Entrar</h3>
<label>E-mail<input id="email" type="email" required></label>
<label>Senha<input id="senha" type="password" required></label>
<button>Entrar</button> <button type="button" class="sec" id="tg">Criar conta</button></form>
<form id="fc" hidden><h3>Cadastro</h3>
<label>Nome<input id="cn" required></label>
<label>E-mail<input id="ce" type="email" required></label>
<label>Senha<input id="cs" type="password" minlength="6" required></label>
<label>Confirmar senha<input id="cc" type="password" required></label>
<button>Cadastrar</button> <button type="button" class="sec" id="tv">Voltar</button></form>
<p id="msg" class="erro"></p></div>
<script src="js/login.js"></script></body></html>
